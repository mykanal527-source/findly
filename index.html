<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Findly</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; background: #fff; }
    #err {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: #fff; color: #c00; font: 14px sans-serif; padding: 12px;
    }
    .me {
      width: 22px; height: 22px; border-radius: 50%;
      background: #4f8cff; border: 3px solid #fff;
      box-shadow: 0 0 0 6px rgba(79,140,255,.3);
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="map"></div>

  <script>
    function showError(t) {
      const e = document.getElementById("err");
      e.style.display = "block";
      e.textContent = t;
    }
    window.onerror = (msg) => showError("Ошибка: " + msg);

    function loadScript(src, onload) {
      const s = document.createElement("script");
      s.src = src;
      s.onload = onload;
      s.onerror = () => showError("Не загрузился файл: " + src);
      document.head.appendChild(s);
    }

    // Telegram: подключаем из своего репозитория, страницу не блокируем
    loadScript("./telegram-web-app.js", () => {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      } catch (e) {}
    });

    // Карта
    loadScript("https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js", () => {
      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: [37.6173, 55.7558],
        zoom: 15.5,
        pitch: 60,
        bearing: -20
      });
      map.on("error", (e) => showError("Карта: " + (e.error && e.error.message)));

      const el = document.createElement("div");
      el.className = "me";
      const marker = new maplibregl.Marker({ element: el })
        .setLngLat([37.6173, 55.7558]).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const c = [pos.coords.longitude, pos.coords.latitude];
            marker.setLngLat(c);
            map.flyTo({ center: c, zoom: 16.5, pitch: 65, duration: 2500 });
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
    });
  </script>
</body>
</html>
