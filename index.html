<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Findly</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; }
    .me {
      width: 22px; height: 22px; border-radius: 50%;
      background: #4f8cff; border: 3px solid #fff;
      box-shadow: 0 0 0 6px rgba(79,140,255,.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [37.6173, 55.7558], // Москва, пока не знаем где ты
      zoom: 15.5,
      pitch: 60,
      bearing: -20
    });

    const el = document.createElement("div");
    el.className = "me";
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([37.6173, 55.7558])
      .addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const c = [pos.coords.longitude, pos.coords.latitude];
          marker.setLngLat(c);
          map.flyTo({ center: c, zoom: 16.5, pitch: 65, duration: 2500 });
        },
        () => {}, // если отказал в доступе, остаёмся на Москве
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
